<!doctype html>
<meta charset="utf-8">
<title>aspex explore</title>
<style>
:root{--bg:#0f1115;--panel:#161a22;--fg:#e6e6e6;--dim:#8b93a7;--line:#262c38;--purple:#a78bfa;--red:#f87171;--yellow:#fbbf24;--green:#34d399;--cyan:#67e8f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;gap:18px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;color:var(--purple)}header .k{color:var(--dim)}header .k b{color:var(--fg)}
nav{display:flex;gap:4px;padding:8px 20px;border-bottom:1px solid var(--line)}
nav button{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{color:var(--fg);border-color:var(--purple)}
main{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 96px)}
#list{overflow:auto;padding:10px 20px}#detail{overflow:auto;border-left:1px solid var(--line);padding:14px 16px;background:var(--panel)}
.row{display:grid;grid-template-columns:70px 72px 1fr;gap:10px;padding:5px 8px;border-radius:5px;cursor:pointer}
.row:hover{background:var(--panel)}.row.sel{background:#1e2433}
.ts{color:var(--dim)}.kind{font-weight:600}.kind.TOOL{color:var(--fg)}.kind.CONTENT{color:var(--cyan)}.kind.NETWORK{color:var(--yellow)}.kind.ERROR{color:var(--red)}.kind.RESOURCE{color:var(--cyan)}
.sev{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;margin-left:6px}.sev.critical,.sev.high{background:#3b1d1d;color:var(--red)}.sev.medium{background:#3b2f14;color:var(--yellow)}.sev.low,.sev.info{background:#1b2a33;color:var(--cyan)}
.what{color:var(--fg)}.what .srv{color:var(--purple)}.what .arg{color:var(--dim);margin-left:8px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.ev{padding:6px 8px;border-left:3px solid var(--line);margin:4px 0;background:#12151c;border-radius:0 5px 5px 0}
.ev .lv{font-size:10px;font-weight:700;letter-spacing:.06em;margin-right:8px}.ev.OBSERVED{border-color:var(--green)}.ev.OBSERVED .lv{color:var(--green)}
.ev.INFERRED{border-color:var(--yellow)}.ev.INFERRED .lv{color:var(--yellow)}.ev.POSSIBLE{border-color:var(--dim)}.ev.POSSIBLE .lv{color:var(--dim)}
.ev.NOT{border-color:var(--red)}.ev.NOT .lv{color:var(--red)}
.chain{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;cursor:pointer}.chain:hover{border-color:var(--purple)}
.arrow{color:var(--dim);text-align:center}.hop{padding:3px 0}.hop b{color:var(--purple)}
.empty{color:var(--dim);padding:30px 0;text-align:center}
svg text{font:12px ui-monospace,Menlo,monospace;fill:var(--fg)}svg .meta{fill:var(--dim);font-size:10px}
.node rect{fill:#1a1f2b;stroke:var(--line);rx:6}.node.server rect{stroke:var(--purple)}.node.resource rect{stroke:var(--cyan)}.node.destination rect{stroke:var(--yellow)}.node.source rect{stroke:var(--dim);stroke-dasharray:3 3}
.edge{stroke:var(--line);stroke-width:1.5;fill:none}.edge.observed{stroke:var(--green)}.edge.critical,.edge.high{stroke:var(--red);stroke-width:2.5}.edge.medium{stroke:var(--yellow)}
.legend{color:var(--dim);font-size:11px;margin:8px 0}.legend i{display:inline-block;width:14px;height:3px;margin:0 6px 0 12px;vertical-align:middle}
select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;margin-left:auto}
.why{color:var(--dim);margin-top:8px}.blast{display:inline-block;padding:2px 8px;border-radius:4px;font-weight:700}.blast.HIGH{background:#3b1d1d;color:var(--red)}.blast.MEDIUM{background:#3b2f14;color:var(--yellow)}.blast.LOW{background:#14342a;color:var(--green)}
</style>
<header><h1>◆ aspex explore</h1><span class="k" id="hdr"></span></header>
<nav><button data-v="timeline" class="on">Timeline</button><button data-v="provenance">Provenance</button><button data-v="killchains">Kill chains</button><button data-v="graph">Capability graph</button><button data-v="findings">Findings</button><select id="session"><option value="">all sessions</option></select></nav>
<main><section id="list"></section><aside id="detail"><div class="empty">Select an item.<br><br>OBSERVED = it is in the log.<br>INFERRED = a relation drawn from order and timing.<br>POSSIBLE = what the capabilities would allow.<br>NOT OBSERVED = what Aspex cannot show.</div></aside></main>
<script>
let D=null,view='timeline',session='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=ts=>new Date(ts).toLocaleTimeString([], {hour12:false});
const ev=e=>`<div class="ev ${e.level.split(' ')[0]}"><span class="lv">${esc(e.level)}</span>${esc(e.text)}</div>`;
fetch('/api/dataset').then(r=>r.json()).then(d=>{D=d;
 $('#hdr').innerHTML=`last <b>${esc(d.window)}</b> · <b>${d.summary.events}</b> events · <b>${d.summary.sessions}</b> sessions · <b>${d.summary.flagged}</b> findings · <b>${d.summary.killchains}</b> kill chains · blast radius <span class="blast ${esc(d.blast_radius.level)}">${esc(d.blast_radius.level)}</span>`;
 for(const s of d.sessions){const o=document.createElement('option');o.value=s.id;o.textContent=`${s.id} · ${s.events} ev · ${s.flagged} flagged`;$('#session').appendChild(o);}
 render();});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});
$('#session').onchange=e=>{session=e.target.value;render();};
function render(){const L=$('#list');L.innerHTML='';({timeline,provenance,killchains,graph,findings})[view]();}
function timeline(){const rows=D.timeline.filter(e=>!session||e.session===session);if(!rows.length)return $('#list').innerHTML='<div class="empty">No events in this window.</div>';
 $('#list').innerHTML=rows.map(e=>`<div class="row" data-id="${e.id}"><span class="ts">${t(e.ts)}</span><span class="kind ${e.kind}">${e.kind}</span><span class="what"><span class="srv">${esc(e.server)}</span>.${esc(e.tool)}${e.severity?`<span class="sev ${e.severity}">${esc(e.severity)}</span>`:''}<span class="arg">${esc(e.detail)}</span></span></div>`).join('');
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{document.querySelectorAll('.row').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');showEntry(+r.dataset.id);});}
function showEntry(id){const e=D.timeline[id];const fs=D.findings.filter(f=>f.entry_id===id);
 let h=`<h2>Event</h2><div><span class="srv" style="color:var(--purple)">${esc(e.server)}</span>.${esc(e.tool)}<br><span class="ts">${new Date(e.ts).toLocaleString()}</span><br>${esc(e.detail)}</div>`;
 if(!fs.length)h+=`<h2>Findings</h2><div class="why">No rule fired on this event.</div>`;
 for(const f of fs){h+=`<h2>${esc(f.rule_id)} · ${esc(f.name)} <span class="sev ${f.severity}">${esc(f.severity)}</span></h2><div class="why">Why does Aspex believe this?</div>${f.evidence.map(ev).join('')}<h2>Remediation</h2><div>${esc(f.fix)}</div><div class="why">${esc(f.mapping)}</div>`;}
 const prov=D.provenance.filter(p=>p.target.id===id||p.source.id===id);if(prov.length){h+=`<h2>Provenance</h2>`+prov.map(p=>`<div class="why">${esc(p.source.server)}.${esc(p.source.tool)} → ${esc(p.target.server)}.${esc(p.target.tool)} (${esc(p.delta)}, ${esc(p.confidence)})</div>`).join('');}
 $('#detail').innerHTML=h;}
function provenance(){const rows=D.provenance.filter(p=>!session||p.target.session===session);if(!rows.length)return $('#list').innerHTML='<div class="empty">No provenance links: no HIGH or CRITICAL call followed an ingestion event closely enough.</div>';
 $('#list').innerHTML=rows.map((p,i)=>`<div class="chain" data-i="${i}"><div class="hop"><b>${esc(p.source.server)}.${esc(p.source.tool)}</b> <span class="ts">${t(p.source.ts)}</span> <span class="arg" style="color:var(--dim)">${esc(p.source.detail)}</span></div><div class="arrow">↓ ${esc(p.delta)} · ${p.events_apart} event(s) apart · <span class="sev ${p.confidence==='high'?'high':p.confidence}">${esc(p.confidence)} confidence</span></div><div class="hop"><b>${esc(p.target.server)}.${esc(p.target.tool)}</b> <span class="ts">${t(p.target.ts)}</span> <span class="arg" style="color:var(--dim)">${esc(p.target.detail)}</span></div></div>`).join('');
 document.querySelectorAll('.chain').forEach(c=>c.onclick=()=>{const p=rows[+c.dataset.i];$('#detail').innerHTML=`<h2>Provenance chain</h2><div class="hop">External content<br>↓<br><b>${esc(p.source.server)}.${esc(p.source.tool)}</b><br>↓<br>Agent<br>↓<br><b>${esc(p.target.server)}.${esc(p.target.tool)}</b></div><h2>Evidence</h2>${p.evidence.map(ev).join('')}`;});}
function killchains(){const rows=D.killchains;if(!rows.length)return $('#list').innerHTML='<div class="empty">No multi-step attack patterns reconstructed in this window.</div>';
 $('#list').innerHTML=rows.map((k,i)=>`<div class="chain" data-i="${i}"><span class="sev ${k.severity}">${esc(k.severity)}</span> <b>${esc(k.name)}</b> <span class="ts">${t(k.start)}</span><div class="why">${esc(k.tactic)}</div>${k.steps.map(s=>`<div class="hop">${esc(s)}</div>`).join('')}</div>`).join('');
 document.querySelectorAll('.chain').forEach(c=>c.onclick=()=>{const k=rows[+c.dataset.i];$('#detail').innerHTML=`<h2>${esc(k.name)}</h2>${k.evidence.map(ev).join('')}`;});}
function findings(){const rows=D.findings.filter(f=>!session||D.timeline[f.entry_id].session===session);if(!rows.length)return $('#list').innerHTML='<div class="empty">No findings.</div>';
 const order={critical:0,high:1,medium:2,low:3,info:4};rows.sort((a,b)=>order[a.severity]-order[b.severity]);
 $('#list').innerHTML=rows.map(f=>`<div class="row" data-id="${f.entry_id}"><span class="ts">${t(f.ts)}</span><span class="sev ${f.severity}" style="margin:0">${esc(f.severity)}</span><span class="what">${esc(f.rule_id)} ${esc(f.name)}<span class="arg">${esc(f.server)}.${esc(f.tool)}</span></span></div>`).join('');
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>showEntry(+r.dataset.id));}
function graph(){const g=D.graph;const cols={source:0,agent:1,server:2,resource:3,destination:3};const byCol=[[],[],[],[]];for(const n of g.nodes)byCol[cols[n.kind]].push(n);
 const W=920,colX=[40,250,460,690],rowH=44,H=Math.max(...byCol.map(c=>c.length))*rowH+60;const pos={};byCol.forEach((c,ci)=>c.forEach((n,i)=>{pos[n.id]={x:colX[ci],y:40+i*rowH}}));
 const node=n=>`<g class="node ${n.kind}"><rect x="${pos[n.id].x}" y="${pos[n.id].y}" width="190" height="34"/><text x="${pos[n.id].x+8}" y="${pos[n.id].y+15}">${esc(n.label.length>24?n.label.slice(0,23)+'…':n.label)}</text><text class="meta" x="${pos[n.id].x+8}" y="${pos[n.id].y+28}">${esc((n.meta||'').slice(0,34))}</text></g>`;
 const edge=e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return'';const x1=a.x+190,y1=a.y+17,x2=b.x,y2=b.y+17;return`<path class="edge ${e.severity||''} ${e.observed?'observed':''}" d="M${x1},${y1} C${x1+40},${y1} ${x2-40},${y2} ${x2},${y2}"/>`};
 $('#list').innerHTML=`<div class="legend">edges: <i style="background:var(--line)"></i>capability <i style="background:var(--green)"></i>exercised in this window <i style="background:var(--red)"></i>on a critical/high attack path <i style="background:var(--yellow)"></i>medium</div><svg width="${W}" height="${H}">${g.edges.map(edge).join('')}${g.nodes.map(node).join('')}</svg>`;
 $('#detail').innerHTML=`<h2>Blast radius <span class="blast ${esc(D.blast_radius.level)}">${esc(D.blast_radius.level)}</span></h2>${D.blast_radius.why.map(r=>`<div class="why">${r.present?'✓':'✗'} ${esc(r.text)}</div>`).join('')}<div class="why" style="margin-top:14px">The graph shows what is configured. Green edges are the subset your agents actually used in this window. A red edge is part of a composition an instruction could walk; it does not mean it was walked.</div>`;}
</script>
