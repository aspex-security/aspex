name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true

      - name: Install syft (for SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # npm: the `aspex` package downloads the matching release archive at install
      # time, so it is published after GoReleaser has uploaded the assets.
      # Authentication is npm Trusted Publishing (OIDC via id-token: write), configured
      # on the package at npmjs.com for this repo and workflow. No token, nothing to
      # rotate, and every version carries provenance back to this run.
      # Trusted Publishing needs npm >= 11.5; the npm bundled with Node 22 is older.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package (aspex)
        working-directory: npm/aspex
        run: |
          npm install -g npm@latest
          npm --version
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm publish --access public --provenance
