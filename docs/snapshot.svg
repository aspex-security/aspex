<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0c18"/>
      <stop offset="1" stop-color="#08071a"/>
    </linearGradient>
  </defs>
  <rect width="820" height="560" rx="14" fill="url(#bg)" stroke="#2a2740" stroke-width="1"/>
  <rect width="820" height="38" rx="14" fill="#120f22"/>
  <rect y="24" width="820" height="14" fill="#120f22"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="410" y="24" text-anchor="middle" fill="#6b6885" font-size="12">aspex</text>

  <g fill="#e2e0ef">
    <text x="28" y="72"><tspan fill="#a78bfa" font-weight="bold">◆</tspan>  <tspan font-weight="bold" fill="#ffffff">Your AI agents, last 30 days</tspan>  <tspan fill="#6b6885">aspex v0.6.0</tspan></text>

    <text x="28" y="106"><tspan fill="#a78bfa">▸</tspan> In the last 30 days your agents made <tspan fill="#ffffff" font-weight="bold">320 tool calls</tspan> to 12 MCP servers.</text>
    <text x="28" y="128"><tspan fill="#a78bfa">▸</tspan> <tspan fill="#ffffff" font-weight="bold">316 of those calls</tspan> went to 11 servers <tspan fill="#fbbf24">no security scan had ever checked</tspan>.</text>
    <text x="28" y="150"><tspan fill="#a78bfa">▸</tspan> <tspan fill="#f87171" font-weight="bold">2 calls</tspan> tripped a detection rule. Most common: cross-server data chain.</text>
    <text x="28" y="172"><tspan fill="#a78bfa">▸</tspan> 7 configured servers, overall security score <tspan fill="#ffffff" font-weight="bold">54/100</tspan>. Riskiest: github (39), not used.</text>

    <text x="44" y="212" xml:space="preserve">github                39  <tspan fill="#f87171">CRITICAL</tspan>  <tspan fill="#6b6885">not used</tspan></text>
    <text x="44" y="232" xml:space="preserve">brave-search          39  <tspan fill="#f87171">CRITICAL</tspan>  <tspan fill="#6b6885">not used</tspan></text>
    <text x="44" y="252" xml:space="preserve">playwright            90  <tspan fill="#67e8f9">MEDIUM  </tspan>  <tspan fill="#6b6885">not used</tspan></text>
    <text x="44" y="272" xml:space="preserve">slack                 95  <tspan fill="#6b6885">clean   </tspan>  4 calls</text>
    <text x="44" y="292" fill="#6b6885">+3 more</text>

    <text x="28" y="330"><tspan fill="#fbbf24" font-weight="bold">?</tspan> <tspan font-weight="bold" fill="#ffffff">In use, never scanned:</tspan></text>
    <text x="44" y="352" xml:space="preserve">Claude_Browser                        197 calls  <tspan fill="#f87171">1 flagged</tspan></text>
    <text x="44" y="372" xml:space="preserve">claude-in-chrome                       72 calls</text>
    <text x="44" y="392" xml:space="preserve">bff806c1-bf52-44a3-ab2b-c289539c8694   12 calls</text>
    <text x="44" y="412" fill="#6b6885">+8 more</text>

    <text x="28" y="452" fill="#6b6885">aspex-scan for findings and fixes  ·  aspex-trace for the full audit trail  ·  aspex share to post this</text>
    <text x="28" y="472" fill="#6b6885">1.9s  ·  read from local configs and logs  ·  nothing sent anywhere</text>
  </g>

  <g>
    <rect x="28" y="500" width="764" height="36" rx="8" fill="#161428" stroke="#2a2740"/>
    <text x="44" y="524" fill="#6b6885">$</text>
    <text x="60" y="524" fill="#e2e0ef">brew install aspex-security/tap/aspex &amp;&amp; aspex</text>
  </g>
</svg>
