version: 2

project_name: aspex

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mcp-scan
    binary: aspex-scan
    main: ./cmd/aspex-scan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: agent-trace
    binary: aspex-trace
    main: ./cmd/aspex-trace
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: aspex-attack
    binary: aspex-attack
    main: ./cmd/aspex-attack
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: aspex-doctor
    binary: aspex-doctor
    main: ./cmd/aspex-doctor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: aspex
    binary: aspex
    main: ./cmd/aspex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

archives:
  - id: mcp-scan
    builds: [mcp-scan]
    name_template: "aspex-scan_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

  - id: agent-trace
    builds: [agent-trace]
    name_template: "aspex-trace_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

  - id: aspex-combined
    builds: [mcp-scan, agent-trace, aspex, aspex-attack, aspex-doctor]
    name_template: "aspex_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

brews:
  - name: aspex
    ids: [aspex-combined]
    repository:
      owner: aspex-security
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for aspex version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/aspex-security/aspex"
    description: "MCP security: see what your AI agents did, then scan what they could do"
    license: "Apache-2.0"
    skip_upload: auto
    install: |
      bin.install "aspex-scan"
      bin.install "aspex-trace"
      bin.install "aspex-attack"
      bin.install "aspex"
      bin.install "aspex-doctor"
    test: |
      system "#{bin}/aspex-scan version"
      system "#{bin}/aspex-trace version"
      system "#{bin}/aspex-attack --version"
      system "#{bin}/aspex --version"
      system "#{bin}/aspex-doctor --version"
    caveats: |
      Start here:

        aspex                 What your AI agents did in the last 30 days, then the menu
        aspex share           Same headlines as a privacy-safe card to paste anywhere

      The two tools:

        aspex-trace           Full audit trail from your AI clients' own logs. No proxy.
        aspex-scan            Audit every MCP server you have configured. 140+ rules.
        aspex-scan doctor     2-second pre-flight: leaked secrets, broad paths, plaintext HTTP

      Make it yours:

        aspex-scan init                                  .aspex.yaml: accept risks with a reason
        aspex-scan --save-baseline aspex-baseline.json   then --baseline to fail only on new findings
        aspex-scan --with-trace                          rank risky servers by how much you use them

      Offline. No account. Nothing leaves your machine.

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: aspex-security
    name: aspex
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    **Full Changelog**: https://github.com/aspex-security/aspex/compare/{{.PreviousTag}}...{{.Tag}}
