version: 2

project_name: aspex

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mcp-scan
    binary: aspex-scan
    main: ./cmd/aspex-scan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: agent-trace
    binary: aspex-trace
    main: ./cmd/aspex-trace
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: aspex-attack
    binary: aspex-attack
    main: ./cmd/aspex-attack
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: aspex-doctor
    binary: aspex-doctor
    main: ./cmd/aspex-doctor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

  - id: aspex
    binary: aspex
    main: ./cmd/aspex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/aspex-security/aspex/internal/version.Version={{.Version}}
      - -X github.com/aspex-security/aspex/internal/version.BuildDate={{.Date}}

archives:
  - id: mcp-scan
    ids: [mcp-scan]
    name_template: "aspex-scan_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: agent-trace
    ids: [agent-trace]
    name_template: "aspex-trace_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: aspex-combined
    ids: [mcp-scan, agent-trace, aspex, aspex-attack, aspex-doctor]
    name_template: "aspex_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# Homebrew: cask only (GoReleaser's replacement for binary formulae). No
# quarantine prompt, no compile step. Casks are macOS; Linux installs use the
# release archives or npm.
homebrew_casks:
  - name: aspex
    ids: [aspex-combined]
    repository:
      owner: aspex-security
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for aspex version {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/aspex-security/aspex"
    description: "Local security debugger for AI agents: know what your agents can do, know what they actually did"
    license: "Apache-2.0"
    skip_upload: auto
    binaries:
      - aspex
      - aspex-scan
      - aspex-trace
      - aspex-attack
      - aspex-doctor
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aspex"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aspex-scan"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aspex-trace"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aspex-attack"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aspex-doctor"]
          end

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: aspex-security
    name: aspex
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    **Full Changelog**: https://github.com/aspex-security/aspex/compare/{{.PreviousTag}}...{{.Tag}}
